<title>スケボースクール予定帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column — next lesson up top, form, then the month-by-month list */
:root {
  --bg: #e9ebe8;        /* concrete */
  --surface: #f7f8f6;
  --fg: #1f2523;
  --muted: #5d6662;
  --line: #cfd4d0;
  --accent: #0f6b5c;    /* park-bench teal */
  --accent-fg: #ffffff;
  --tape: #ffd23f;      /* grip-tape warning yellow */
  --tape-fg: #2a2300;
  --danger: #b3261e;
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161a19; --surface: #202624; --fg: #e8ece9; --muted: #9aa5a0; --line: #333b38;
  --accent: #4fc2aa; --accent-fg: #0b1a17; --tape: #f2c530; --tape-fg: #221c00; --danger: #ff8a80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161a19; --surface: #202624; --fg: #e8ece9; --muted: #9aa5a0; --line: #333b38;
  --accent: #4fc2aa; --accent-fg: #0b1a17; --tape: #f2c530; --tape-fg: #221c00; --danger: #ff8a80; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 24px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.05rem; margin: 0; letter-spacing: .02em; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: .9rem; }

.next { background: var(--tape); color: var(--tape-fg); border-radius: 14px; padding: 18px 20px; display: grid; gap: 4px; }
.next .label { font-size: .75rem; font-weight: 700; letter-spacing: .12em; }
.next .when { font-family: var(--f-display); font-size: 1.5rem; line-height: 1.25; }
.next .meta { font-weight: 500; }

.status { font-size: .85rem; color: var(--muted); }
.status.err { color: var(--danger); }

form { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .row { grid-template-columns: 1fr; } }
label { display: grid; gap: 4px; font-size: .8rem; font-weight: 700; color: var(--muted); min-width: 0; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; box-sizing: border-box; }
textarea { min-height: 56px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; font-weight: 700; border-radius: 999px; padding: 9px 18px; border: 1px solid transparent; cursor: pointer; }
.primary { background: var(--accent); color: var(--accent-fg); }
.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
button:disabled { opacity: .5; cursor: default; }

.month { display: grid; gap: 8px; }
.month h2 { color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
li.item { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.date { text-align: center; font-variant-numeric: tabular-nums; }
.date .d { font-family: var(--f-display); font-size: 1.6rem; line-height: 1; }
.date .w { font-size: .75rem; color: var(--muted); font-weight: 700; }
.date .w.sat { color: var(--accent); } .date .w.sun { color: var(--danger); }
.body { min-width: 0; display: grid; gap: 2px; }
.top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.time { font-weight: 700; font-variant-numeric: tabular-nums; }
.place { overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.chip { font-size: .75rem; font-weight: 700; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.me { border-color: var(--accent); color: var(--accent); }
.chip.him { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chip.off { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.note { color: var(--muted); font-size: .88rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.item.cancelled .top, .item.cancelled .date { text-decoration: line-through; opacity: .55; }
.tools { display: flex; gap: 12px; margin-top: 4px; flex-wrap: wrap; }
.link { background: none; border: none; padding: 2px 0; color: var(--accent); font-size: .82rem; font-weight: 700; border-radius: 4px; }
.link.del { color: var(--danger); }
.confirm { font-size: .82rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 20px; color: var(--muted); }
details summary { cursor: pointer; color: var(--muted); font-weight: 700; font-size: .9rem; }
details[open] summary { margin-bottom: 8px; }
</style>

<div class="wrap">
  <header>
    <h1>スケボースクール予定帳</h1>
    <p class="sub">ふたりで同じ予定を見て、追加・変更できます。送迎担当も決めておけます。</p>
  </header>

  <section class="next" id="next" hidden>
    <span class="label">次のレッスン</span>
    <span class="when" id="nextWhen"></span>
    <span class="meta" id="nextMeta"></span>
  </section>

  <p class="status" id="status">予定を読み込んでいます…</p>

  <form id="form" autocomplete="off">
    <h2 id="formTitle">予定を追加</h2>
    <div class="row">
      <label>日付<input type="date" id="fDate" required></label>
      <label>場所<input type="text" id="fPlace" placeholder="例：〇〇スケートパーク" maxlength="80"></label>
    </div>
    <div class="row">
      <label>開始<input type="time" id="fStart" required></label>
      <label>終了<input type="time" id="fEnd"></label>
    </div>
    <div class="row">
      <label>送迎担当
        <select id="fWho">
          <option value="">未定</option>
          <option value="me">わたし</option>
          <option value="him">夫</option>
          <option value="both">ふたりで</option>
        </select>
      </label>
      <label>状態
        <select id="fState">
          <option value="ok">予定どおり</option>
          <option value="off">休み・中止</option>
        </select>
      </label>
    </div>
    <label>メモ<textarea id="fNote" placeholder="持ち物、振替、月謝など" maxlength="400"></textarea></label>
    <div class="actions">
      <button type="submit" class="primary" id="fSubmit">追加する</button>
      <button type="button" class="ghost" id="fCancel" hidden>編集をやめる</button>
    </div>
  </form>

  <section id="list"></section>

  <details id="pastWrap" hidden>
    <summary id="pastSummary">終わった予定</summary>
    <section id="past"></section>
  </details>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  const WHO = { me: "送迎：わたし", him: "送迎：夫", both: "送迎：ふたり", "": "送迎：未定" };
  let col = null, docs = [], editingId = null, confirmId = null;

  const todayStr = () => { const t = new Date(); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"); };
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const setStatus = (msg, err) => { const s = $("status"); s.textContent = msg; s.hidden = !msg; s.classList.toggle("err", !!err); };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const timeText = (l) => (l.start || "") + (l.end ? "〜" + l.end : "");

  $("fDate").value = todayStr();
  $("fStart").value = "10:00";

  function itemNode(l) {
    const d = parse(l.date), wd = d.getDay();
    const li = el("li", "item" + (l.state === "off" ? " cancelled" : ""));
    const date = el("div", "date");
    date.append(el("div", "d", String(d.getDate())), el("div", "w" + (wd === 6 ? " sat" : wd === 0 ? " sun" : ""), WD[wd] + "曜"));
    const body = el("div", "body");
    const top = el("div", "top");
    top.append(el("span", "time", timeText(l)), el("span", "place", l.place || "場所未定"));
    const chips = el("div", "chips");
    if (l.state === "off") chips.append(el("span", "chip off", "休み・中止"));
    chips.append(el("span", "chip" + (l.who === "me" ? " me" : l.who === "him" || l.who === "both" ? " him" : ""), WHO[l.who || ""]));
    body.append(top, chips);
    if (l.note) body.append(el("div", "note", l.note));
    const tools = el("div", "tools");
    if (confirmId === l.id) {
      const c = el("div", "confirm");
      const yes = el("button", "link del", "削除する"); yes.type = "button";
      const no = el("button", "link", "やめる"); no.type = "button";
      yes.onclick = () => remove(l.id); no.onclick = () => { confirmId = null; render(); };
      c.append(el("span", null, "この予定を消しますか？"), yes, no);
      tools.append(c);
    } else {
      const ed = el("button", "link", "編集"); ed.type = "button"; ed.onclick = () => startEdit(l);
      const del = el("button", "link del", "削除"); del.type = "button"; del.onclick = () => { confirmId = l.id; render(); };
      tools.append(ed, del);
    }
    body.append(tools);
    li.append(date, body);
    return li;
  }

  function groupInto(container, items) {
    container.replaceChildren();
    let curKey = null, ul = null;
    for (const l of items) {
      const d = parse(l.date), key = d.getFullYear() + "-" + d.getMonth();
      if (key !== curKey) {
        curKey = key;
        const m = el("div", "month");
        m.append(el("h2", null, d.getFullYear() + "年" + (d.getMonth() + 1) + "月"));
        ul = el("ul"); m.append(ul); container.append(m);
      }
      ul.append(itemNode(l));
    }
  }

  function render() {
    const today = todayStr();
    const sorted = docs.slice().sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
    const upcoming = sorted.filter((l) => l.date >= today);
    const past = sorted.filter((l) => l.date < today).reverse();

    const nxt = upcoming.find((l) => l.state !== "off");
    $("next").hidden = !nxt;
    if (nxt) {
      const d = parse(nxt.date);
      $("nextWhen").textContent = (d.getMonth() + 1) + "月" + d.getDate() + "日（" + WD[d.getDay()] + "）" + timeText(nxt);
      $("nextMeta").textContent = (nxt.place || "場所未定") + "・" + WHO[nxt.who || ""];
    }

    if (upcoming.length) groupInto($("list"), upcoming);
    else {
      const e = el("div", "empty", col ? "これからの予定はまだありません。上のフォームから最初のレッスンを追加してください。" : "");
      $("list").replaceChildren(col ? e : "");
    }
    $("pastWrap").hidden = !past.length;
    $("pastSummary").textContent = "終わった予定（" + past.length + "件）";
    groupInto($("past"), past);
  }

  function readForm() {
    return {
      date: $("fDate").value, start: $("fStart").value, end: $("fEnd").value,
      place: $("fPlace").value.trim(), who: $("fWho").value, state: $("fState").value,
      note: $("fNote").value.trim(), updatedAt: new Date().toISOString(),
    };
  }
  function resetForm() {
    editingId = null; $("form").reset(); $("fDate").value = todayStr(); $("fStart").value = "10:00";
    $("formTitle").textContent = "予定を追加"; $("fSubmit").textContent = "追加する"; $("fCancel").hidden = true;
  }
  function startEdit(l) {
    editingId = l.id;
    $("fDate").value = l.date || ""; $("fStart").value = l.start || ""; $("fEnd").value = l.end || "";
    $("fPlace").value = l.place || ""; $("fWho").value = l.who || ""; $("fState").value = l.state || "ok"; $("fNote").value = l.note || "";
    $("formTitle").textContent = "予定を編集"; $("fSubmit").textContent = "変更を保存"; $("fCancel").hidden = false;
    $("form").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  $("fCancel").onclick = resetForm;
  $("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (!col) { setStatus("まだ保存先につながっていません。少し待ってからもう一度お試しください。", true); return; }
    const data = readForm(), btn = $("fSubmit");
    btn.disabled = true;
    try {
      if (editingId) await col.doc(editingId).set(data); else await col.add(data);
      resetForm(); setStatus("");
    } catch (e) {
      setStatus(e && e.code === "not_granted" || e && e.code === "permission_denied"
        ? "このページを編集する権限がありません。共有した人に「編集できる」権限をもらってください。"
        : "保存できませんでした。通信状況を確認して、もう一度お試しください。", true);
    } finally { btn.disabled = false; }
  });

  async function remove(id) {
    confirmId = null;
    try { await col.doc(id).delete(); if (editingId === id) resetForm(); }
    catch (e) { setStatus("削除できませんでした。編集権限と通信状況を確認してください。", true); render(); }
  }

  render();
  (async () => {
    const db = window.claude ? await window.claude.use("db") : null;
    if (!db) { setStatus("予定の保存先につながりません。claude.ai にログインした状態で開いてください。", true); return; }
    col = db.collection("lessons");
    const timer = setTimeout(() => setStatus("予定の読み込みに時間がかかっています。表示が古い可能性があります。", true), 10000);
    col.onSnapshot((snap) => {
      docs = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      if (!snap.metadata.fromCache) { clearTimeout(timer); setStatus(""); }
      render();
    }, () => { clearTimeout(timer); setStatus("予定を読み込めませんでした。ページを開き直してください。", true); });
  })();
})();
</script>
