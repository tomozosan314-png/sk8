<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>スケボー連絡帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<header class="band">
  <div class="band-inner">
    <p class="school" id="school"></p>
    <h1 class="title">スケボー連絡帳</h1>
    <p class="who" id="who"></p>
    <a class="help-chip" href="guide.html" target="_blank" rel="noopener"><span class="q-mark" aria-hidden="true">?</span>使い方</a>
  </div>
</header>

<main class="wrap">
  <div class="sample-flag" id="flag" hidden></div>

  <section class="card" id="latestCard" hidden aria-labelledby="h-latest">
    <h2 id="h-latest"><span class="dot"></span>最新の連絡帳</h2>
    <div id="latest"></div>
  </section>


  <section class="card" id="historyCard" hidden aria-labelledby="h-history">
    <h2 id="h-history"><span class="dot"></span>これまでの連絡帳</h2>
    <div class="history" id="history"></div>
  </section>

  <section class="card" id="msgCard" hidden aria-labelledby="h-msg">
    <h2 id="h-msg"><span class="dot"></span>質問・メッセージ</h2>
    <form class="form" id="msgForm">
      <div class="field">
        <label for="msgName">お名前（保護者さま）</label>
        <input type="text" id="msgName" name="parent-name-input" autocomplete="off" placeholder="例：山田（母）">
      </div>
      <div class="field">
        <label for="msgText">内容</label>
        <textarea id="msgText" required placeholder="質問やご連絡があればご記入ください"></textarea>
      </div>
      <button class="btn btn-outline" type="submit" id="msgBtn">メッセージを送る</button>
      <p class="status" id="msgStatus" role="status"></p>
    </form>
  </section>

  <section class="card" aria-labelledby="h-links">
    <h2 id="h-links"><span class="dot"></span>次回・リンク</h2>
    <div class="form">
      <a class="btn btn-primary" id="reserveBtn" target="_blank" rel="noopener"></a>
      <div class="btn-row">
        <a class="btn btn-insta" id="instaBtn" target="_blank" rel="noopener"></a>
        <a class="btn btn-line" id="lineBtn" target="_blank" rel="noopener"></a>
      </div>
      <a class="btn btn-help" href="guide.html" target="_blank" rel="noopener"><span class="q-mark" aria-hidden="true">?</span><span>連絡帳の使い方を見る</span></a>
    </div>
  </section>
</main>

<script>
(function () {
  const C = window.SK8_CONFIG, S = window.SK8, el = S.el, $ = (id) => document.getElementById(id);
  $("school").textContent = C.schoolName;

  const SAMPLE = {
    student: { id: "sample", name: "そうた", grade: "小学2年" },
    entries: [
      { id: "s1", date: "2026-10-25", count: "4",
        feedback: "プッシュのフォームがきれいになってきました。止まるときに後ろ足をしっかり使えています。",
        good: "ストップが一人でできるようになりました！", next: "オーリーに挑戦", home: "", notice: "", readAt: "2026-10-25 19:12" },
      { id: "s2", date: "2026-11-08", count: "5",
        feedback: "今日はオーリーの練習をがんばりました！\n最初は後ろ足を弾くタイミングが早かったけど、何回もチャレンジして、最後は少し板が浮くようになりました。転んでもすぐ立ち上がれて、とてもかっこよかったです。",
        good: "チックタックで方向を変えられるようになりました。", next: "オーリーで前足をしっかり引き上げる",
        home: "平らな場所で、板に乗ったままひざを曲げ伸ばしする練習（10回×3セット）",
        notice: "次回はヘルメット・ひじ・ひざのプロテクターを忘れずにお持ちください。", readAt: "" },
    ],
  };

  const token = (location.hash.match(/^#s=([0-9a-f]+)$/) || [])[1];
  let isSample = false, student = null;

  function flag(text) { $("flag").textContent = text; $("flag").hidden = !text; }

  // ----- 1回分の連絡帳を組み立てる -----
  function entryView(e) {
    const box = el("div", { class: "entry" });
    box.append(
      el("dl", { class: "meta" },
        el("div", {}, el("dt", {}, "日付"), el("dd", {}, S.formatDate(e.date))),
        el("div", { class: "count" }, el("dt", {}, "レッスン"), el("dd", {}, e.count ? e.count + "回目" : "—"))),
    );
    box.append(el("div", { class: "sub" }, el("h3", {}, "コーチからのフィードバック"), el("p", { class: "feedback" }, e.feedback || "")));
    [["よかったところ・できたこと", e.good], ["次回の目標", e.next], ["おうちでできる練習", e.home], ["おしらせ・持ち物", e.notice]]
      .forEach(([h, v]) => { if (v) box.append(el("div", { class: "sub" }, el("h3", {}, h), el("p", {}, v))); });

    // 既読ボタン
    const btn = el("button", { class: "btn", type: "button" });
    const st = el("p", { class: "status", role: "status" });
    const setRead = (at) => {
      btn.className = at ? "btn btn-ok" : "btn btn-primary"; btn.disabled = !!at;
      btn.innerHTML = S.ICONS.check + (at ? "<span>確認しました</span>" : "<span>読みました</span>");
      st.className = "status ok"; st.textContent = at ? at + " に確認済み" : "";
    };
    setRead(e.readAt);
    btn.addEventListener("click", async () => {
      if (isSample) { st.className = "status"; st.textContent = "見本のため送信されません。"; return; }
      btn.disabled = true; st.className = "status"; st.textContent = "送信中…";
      try { const r = await S.post({ type: "read", s: token, entry: e.id }); e.readAt = r.readAt; setRead(r.readAt); renderHistoryBadges(); }
      catch (err) { btn.disabled = false; st.className = "status err"; st.textContent = "送信できませんでした。電波の良い場所でもう一度押してください。"; }
    });
    box.append(el("div", { class: "sub read-box" }, el("p", { class: "note", style: "margin:0 0 8px" }, "お読みになったら押してください。コーチに既読が届きます。"), btn, st));
    return box;
  }

  let entries = [];
  function renderHistoryBadges() {
    document.querySelectorAll("[data-badge]").forEach((b) => {
      const e = entries.find((x) => x.id === b.dataset.badge);
      b.className = "pill " + (e.readAt ? "done" : "try"); b.textContent = e.readAt ? "既読" : "未読";
    });
  }

  function render(data) {
    student = data.student;
    entries = data.entries.slice().sort((a, b) => (String(a.date) + a.count).localeCompare(String(b.date) + b.count));
    $("who").textContent = student.name + " さん" + (student.grade ? "（" + student.grade + "）" : "") + "　レッスン " + entries.length + "回分の記録";
    $("msgCard").hidden = false;

    if (!entries.length) { flag("まだ連絡帳はありません。レッスン後にコーチが書いたら、ここに表示されます。"); return; }
    const latest = entries[entries.length - 1];
    $("latest").replaceChildren(entryView(latest)); $("latestCard").hidden = false;

    const past = entries.slice(0, -1).reverse();
    $("historyCard").hidden = !past.length;
    $("history").replaceChildren(...past.map((e) => {
      const d = el("details", {},
        el("summary", {},
          el("span", { class: "h-count" }, (e.count || "?") + "回目"),
          el("span", { class: "h-date" }, S.formatDate(e.date)),
          el("span", { class: "pill", "data-badge": e.id })));
      let built = false;
      d.addEventListener("toggle", () => { if (d.open && !built) { d.append(entryView(e)); built = true; } });
      return d;
    }));
    renderHistoryBadges();
  }

  // ----- 読み込み -----
  async function load() {
    if (!token) { isSample = true; flag("これは見本です。コーチから届いた専用リンクを開くと、お子さまの連絡帳が表示されます。"); render(SAMPLE); return; }
    flag("読み込み中…");
    try { const d = await S.get({ s: token }); flag(""); render(d); }
    catch (e) {
      flag(e.code === "not_found" ? "リンクが正しくないようです。コーチから届いたリンクをもう一度開いてください。"
        : e.code === "no_gas" ? "まだ準備中です。しばらくお待ちください。"
        : "読み込めませんでした。電波の良い場所で、ページを開き直してください。");
    }
  }
  load();

  // ----- メッセージ -----
  $("msgForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const text = $("msgText").value.trim(); if (!text) return;
    if (isSample) { $("msgStatus").className = "status"; $("msgStatus").textContent = "見本のため送信されません。"; return; }
    $("msgBtn").disabled = true; $("msgStatus").className = "status"; $("msgStatus").textContent = "送信中…";
    try {
      const latest = entries[entries.length - 1];
      await S.post({ type: "message", s: token, entry: latest ? latest.id : "", from: $("msgName").value.trim(), text });
      $("msgText").value = ""; $("msgStatus").className = "status ok";
      $("msgStatus").textContent = "送信しました。コーチからのお返事は公式LINEなどでお送りします。";
    } catch (e) {
      $("msgStatus").className = "status err"; $("msgStatus").textContent = "送信できませんでした。お手数ですが公式LINEからお送りください。";
    } finally { $("msgBtn").disabled = false; }
  });

  // 以前のしくみでこの端末に覚えていた名前を消す
  try { localStorage.removeItem("sk8-parent-name"); } catch (e) {}
  $("msgName").value = "";

  // ----- リンク -----
  const r = $("reserveBtn");
  if (C.reserveUrl) { r.href = C.reserveUrl; r.innerHTML = S.ICONS.calendar + "<span>次回の予約をする</span>"; }
  else { r.removeAttribute("href"); r.setAttribute("aria-disabled", "true"); r.innerHTML = S.ICONS.calendar + "<span>次回の予約（準備中）</span>"; }
  $("instaBtn").href = C.instagramUrl; $("instaBtn").innerHTML = S.ICONS.insta + "<span>Instagram</span>";
  $("lineBtn").href = C.lineUrl; $("lineBtn").innerHTML = S.ICONS.line + "<span>公式LINE</span>";
})();
</script>
</body>
</html>
