<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>連絡帳 ストーリー画像</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* Instagram ストーリー 1080×1920。上下の約220pxはアカウント名・返信欄がかぶるので文字を置かない */
  :root {
    --grip: #232826; --grip-2: #2c322f; --ink: #f3f5f2; --muted: #b9c2bc;
    --accent: #ff6a2b; --accent-ink: #ffffff;
    --display: "Dela Gothic One", sans-serif; --body: "Zen Maru Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: var(--grip); color: var(--ink); font-family: var(--body); }
  .story { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  canvas#grip { position: absolute; inset: 0; }

  /* オレンジの太い帯（デッキテープの上のステッカーのイメージ） */
  .slash {
    position: absolute; left: -120px; top: 1150px; width: 1400px; height: 300px;
    background: var(--accent); transform: rotate(-8deg); opacity: .95;
  }

  .head { position: absolute; top: 210px; left: 80px; right: 80px; }
  .brand { font-size: 30px; letter-spacing: .14em; color: var(--muted); margin: 0 0 22px; font-weight: 700; }
  .title { font-family: var(--display); font-size: 116px; line-height: 1.1; margin: 0; letter-spacing: .01em; }
  .badge {
    display: inline-block; margin-top: 22px; background: var(--accent); color: var(--accent-ink);
    font-family: var(--display); font-size: 58px; padding: 10px 34px 14px; border-radius: 14px;
    transform: rotate(-3deg);
  }
  .lead { font-size: 36px; line-height: 1.55; margin: 26px 0 0; font-weight: 700; }

  /* スマホの見本 */
  .phone {
    position: absolute; top: 945px; right: 60px; width: 490px; height: 780px;
    border-radius: 72px; background: #0c0e0d; padding: 18px;
    box-shadow: 0 40px 80px rgba(0,0,0,.55), 0 0 0 3px #3a413d;
    transform: rotate(5deg);
  }
  .screen { width: 100%; height: 100%; border-radius: 56px; overflow: hidden; background: #eef0ec; }
  .screen img { width: 100%; display: block; }
  .notch { position: absolute; top: 34px; left: 50%; width: 150px; height: 40px; margin-left: -75px; border-radius: 20px; background: #0c0e0d; }

  /* できること */
  .points { position: absolute; top: 990px; left: 60px; width: 430px; display: grid; gap: 26px; }
  .point {
    background: var(--ink); color: var(--grip); border-radius: 22px; padding: 22px 26px;
    font-size: 34px; font-weight: 700; line-height: 1.4;
    box-shadow: 0 16px 34px rgba(0,0,0,.35);
  }
  .point small { display: block; font-size: 25px; color: #4c5651; font-weight: 500; margin-top: 4px; }
  .point:nth-child(1) { transform: rotate(-2deg); }
  .point:nth-child(2) { transform: rotate(1.5deg); }
  .point:nth-child(3) { transform: rotate(-1deg); }

  .foot { position: absolute; left: 80px; right: 80px; top: 1790px; display: flex; justify-content: space-between; align-items: baseline; }
  .foot p { margin: 0; font-size: 28px; color: var(--muted); font-weight: 700; }
</style>
</head>
<body>
<div class="story">
  <canvas id="grip" width="1080" height="1920"></canvas>
  <div class="slash"></div>

  <div class="head">
    <p class="brand">COCCO PARK SKATEBOARD SCHOOL</p>
    <h1 class="title">スケボー<br>連絡帳</h1>
    <span class="badge">はじめました！</span>
    <p class="lead">レッスンのあと、コーチからの<br>フィードバックがスマホに届きます</p>
  </div>

  <div class="points">
    <div class="point">毎回のフィードバック<small>できたこと・次の目標</small></div>
    <div class="point">これまでの記録も<br>ずっと見られる<small>成長がひと目でわかる</small></div>
    <div class="point">質問もここから<small>読んだら「読みました」</small></div>
  </div>

  <div class="phone">
    <div class="screen"><img src="phone-sample.png" alt=""></div>
    <div class="notch"></div>
  </div>

  <div class="foot">
    <p>生徒さんのご家庭に順次お届け</p>
    <p>※画面は見本です</p>
  </div>
</div>
<script>
  // デッキテープ（グリップテープ）のざらざらした質感
  const c = document.getElementById("grip"), x = c.getContext("2d");
  x.fillStyle = "#232826"; x.fillRect(0, 0, c.width, c.height);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 90000; i++) {
    const v = rnd(); x.fillStyle = v > .5 ? "rgba(255,255,255,.05)" : "rgba(0,0,0,.25)";
    x.fillRect(rnd() * c.width, rnd() * c.height, 2, 2);
  }
</script>
</body>
</html>
