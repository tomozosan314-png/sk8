<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>連絡帳 コーチ用</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<header class="band">
  <div class="band-inner">
    <p class="school" id="school"></p>
    <h1 class="title">連絡帳を書く（コーチ用）</h1>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <h2><span class="dot"></span>レッスン情報</h2>
    <div class="form">
      <div class="grid2">
        <div class="field"><label for="name">生徒さんの名前</label><input type="text" id="name" placeholder="そうた"></div>
        <div class="field"><label for="grade">学年・年齢（任意）</label><input type="text" id="grade" placeholder="小学2年"></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="date">日付</label><input type="date" id="date"></div>
        <div class="field"><label for="time">時間</label><input type="text" id="time" placeholder="10:00〜11:00"></div>
        <div class="field"><label for="count">何回目</label><input type="number" id="count" min="1" placeholder="5"></div>
      </div>
      <div class="field">
        <label for="mood">今日の様子</label>
        <select id="mood">
          <option value="">（表示しない）</option>
          <option value="5">★★★★★ 絶好調！</option>
          <option value="4">★★★★☆ 元気いっぱい</option>
          <option value="3">★★★☆☆ 楽しそう</option>
          <option value="2">★★☆☆☆ ふつう</option>
          <option value="1">★☆☆☆☆ ちょっと疲れ気味</option>
        </select>
      </div>
    </div>
  </section>

  <section class="card">
    <h2><span class="dot"></span>フィードバック</h2>
    <div class="form">
      <div class="field"><label for="feedback">コーチからのフィードバック</label><textarea id="feedback" style="min-height:160px" placeholder="今日の練習の様子や、がんばったことを書いてください"></textarea></div>
      <div class="field"><label for="good">よかったところ・できたこと（任意）</label><textarea id="good"></textarea></div>
      <div class="field"><label for="next">次回の目標（任意）</label><input type="text" id="next"></div>
      <div class="field"><label for="home">おうちでできる練習（任意）</label><textarea id="home"></textarea></div>
      <div class="field"><label for="notice">おしらせ・持ち物（任意）</label><textarea id="notice"></textarea></div>
    </div>
  </section>

  <section class="card">
    <h2><span class="dot"></span>技のチェック（任意）</h2>
    <ul class="skills" id="skillPicker"></ul>
  </section>

  <section class="card">
    <h2><span class="dot"></span>連絡帳リンクを作る</h2>
    <button class="btn btn-primary" id="makeBtn" type="button">リンクを作成</button>
    <div id="out" hidden style="margin-top:12px" class="form">
      <div class="field"><label for="link">このリンクを保護者さまにLINEなどで送ってください</label><textarea id="link" readonly style="min-height:90px;font-size:13px"></textarea></div>
      <div class="btn-row">
        <button class="btn btn-outline" id="copyBtn" type="button">リンクをコピー</button>
        <a class="btn btn-outline" id="previewBtn" target="_blank" rel="noopener">表示を確認</a>
      </div>
      <p class="status" id="makeStatus" role="status"></p>
    </div>
  </section>

  <section class="card">
    <h2><span class="dot"></span>既読・メッセージの確認</h2>
    <div class="form">
      <div class="field"><label for="key">管理キー（Apps Script で設定したもの）</label><input type="password" id="key" autocomplete="off"></div>
      <button class="btn btn-outline" id="loadBtn" type="button">最新の状況を見る</button>
      <p class="status" id="loadStatus" role="status"></p>
    </div>
    <div id="dash" hidden>
      <h3 style="margin:16px 0 6px;font-size:15px">連絡帳</h3>
      <div class="table-scroll"><table><thead><tr><th>日付</th><th>生徒</th><th>回</th><th>既読</th></tr></thead><tbody id="entryRows"></tbody></table></div>
      <h3 style="margin:20px 0 6px;font-size:15px">メッセージ</h3>
      <div class="table-scroll"><table><thead><tr><th>受信</th><th>生徒</th><th>差出人</th><th>内容</th></tr></thead><tbody id="msgRows"></tbody></table></div>
    </div>
    <p class="note">Googleスプレッドシートを開いても同じ内容を確認できます。</p>
  </section>
</main>

<script>
(function () {
  const C = window.SK8_CONFIG, S = window.SK8, $ = (id) => document.getElementById(id);
  $("school").textContent = C.schoolName;
  $("date").value = new Date().toLocaleDateString("sv-SE");
  $("key").value = S.store("sk8-admin-key") || "";

  // 技のチェック選択
  S.SKILLS.forEach((sk, i) => {
    const li = document.createElement("li");
    const n = document.createElement("label"); n.htmlFor = "sk" + i; n.textContent = sk; n.style.margin = "0"; n.style.fontWeight = "500";
    const sel = document.createElement("select"); sel.id = "sk" + i; sel.dataset.skill = sk; sel.style.width = "auto";
    sel.innerHTML = '<option value="">—</option><option value="new">はじめて</option><option value="try">練習中</option><option value="done">できた！</option>';
    li.append(n, sel); $("skillPicker").appendChild(li);
  });

  const fmt = (iso) => iso ? new Date(iso).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";

  $("makeBtn").addEventListener("click", async () => {
    if (!$("name").value.trim() || !$("feedback").value.trim()) {
      $("out").hidden = false; $("makeStatus").className = "status err";
      $("makeStatus").textContent = "生徒さんの名前とフィードバックを入力してください。"; return;
    }
    const skills = {};
    document.querySelectorAll("[data-skill]").forEach((s) => { if (s.value) skills[s.dataset.skill] = s.value; });
    const data = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: $("name").value.trim(), grade: $("grade").value.trim(),
      date: $("date").value, time: $("time").value.trim(), count: Number($("count").value) || "",
      mood: Number($("mood").value) || 0,
      feedback: $("feedback").value.trim(), good: $("good").value.trim(), next: $("next").value.trim(),
      home: $("home").value.trim(), notice: $("notice").value.trim(), skills,
    };
    const url = new URL("index.html", location.href); url.hash = "d=" + S.encode(data);
    $("link").value = url.toString(); $("previewBtn").href = url.toString(); $("out").hidden = false;
    $("makeStatus").className = "status"; $("makeStatus").textContent = "";
    // 既読管理のため、作成した連絡帳を記録
    if (C.gasUrl && $("key").value) {
      S.store("sk8-admin-key", $("key").value);
      try { await S.post({ type: "entry", key: $("key").value, id: data.id, name: data.name, date: data.date, count: data.count });
        $("makeStatus").className = "status ok"; $("makeStatus").textContent = "リンクを作成し、既読管理に登録しました。"; }
      catch (e) { $("makeStatus").className = "status err"; $("makeStatus").textContent = "リンクは作成できましたが、既読管理への登録に失敗しました。"; }
    } else {
      $("makeStatus").textContent = "リンクを作成しました。（下の管理キーを入れておくと、未読の連絡帳も一覧に出ます）";
    }
  });

  $("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText($("link").value)
      .then(() => { $("makeStatus").className = "status ok"; $("makeStatus").textContent = "コピーしました。"; })
      .catch(() => { $("link").select(); $("makeStatus").textContent = "選択しました。長押しでコピーしてください。"; });
  });

  $("loadBtn").addEventListener("click", async () => {
    if (!C.gasUrl) { $("loadStatus").className = "status err"; $("loadStatus").textContent = "config.js に Apps Script のURLを設定してください。"; return; }
    S.store("sk8-admin-key", $("key").value);
    $("loadStatus").className = "status"; $("loadStatus").textContent = "読み込み中…";
    try {
      const res = await fetch(C.gasUrl + "?key=" + encodeURIComponent($("key").value));
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || "error");
      const reads = {}; j.reads.forEach((r) => { (reads[r.id] = reads[r.id] || r); });
      const entries = j.entries.slice();
      // 登録されていない連絡帳でも既読があれば表示
      j.reads.forEach((r) => { if (!entries.some((e) => e.id === r.id)) entries.push(r); });
      entries.sort((a, b) => String(b.date).localeCompare(String(a.date)));
      $("entryRows").replaceChildren(...entries.map((e) => {
        const tr = document.createElement("tr"); const r = reads[e.id];
        [String(e.date || "").slice(0, 10), e.name, e.count].forEach((v) => { const td = document.createElement("td"); td.textContent = v ?? ""; tr.appendChild(td); });
        const td = document.createElement("td"); const p = document.createElement("span");
        p.className = "pill " + (r ? "done" : "new"); p.textContent = r ? "既読 " + fmt(r.at) : "未読"; td.appendChild(p); tr.appendChild(td);
        return tr;
      }));
      const msgs = j.messages.slice().reverse();
      $("msgRows").replaceChildren(...(msgs.length ? msgs.map((mm) => {
        const tr = document.createElement("tr");
        [fmt(mm.at), mm.name, mm.from, mm.text].forEach((v, i) => { const td = document.createElement("td"); td.textContent = v ?? ""; if (i === 3) td.style.whiteSpace = "pre-wrap"; tr.appendChild(td); });
        return tr;
      }) : [(() => { const tr = document.createElement("tr"); const td = document.createElement("td"); td.colSpan = 4; td.textContent = "メッセージはまだありません"; tr.appendChild(td); return tr; })()]));
      $("dash").hidden = false; $("loadStatus").className = "status ok"; $("loadStatus").textContent = "更新しました。";
    } catch (e) {
      $("loadStatus").className = "status err";
      $("loadStatus").textContent = e.message === "bad_key" ? "管理キーが違います。" : "読み込めませんでした。URLと公開設定を確認してください。";
    }
  });
})();
</script>
</body>
</html>
