<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>連絡帳 コーチ用</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<header class="band">
  <div class="band-inner">
    <p class="school" id="school"></p>
    <h1 class="title">連絡帳（コーチ用）</h1>
  </div>
</header>

<main class="wrap">
  <!-- ログイン -->
  <section class="card" id="loginCard">
    <h2><span class="dot"></span>合言葉を入れてください</h2>
    <form class="form" id="loginForm">
      <div class="field"><label for="key">合言葉（Apps Script の ADMIN_KEY）</label><input type="password" id="key" autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit">開く</button>
      <p class="status" id="loginStatus" role="status"></p>
    </form>
  </section>

  <div id="app" hidden class="wrap-inner">
    <!-- 連絡帳を書く -->
    <section class="card">
      <h2><span class="dot"></span>連絡帳を書く</h2>
      <form class="form" id="entryForm">
        <div class="field"><label for="student">生徒さん</label><select id="student" required></select></div>
        <div class="grid2">
          <div class="field"><label for="date">日付</label><input type="date" id="date" required></div>
          <div class="field"><label for="count">何回目</label><input type="number" id="count" min="1"></div>
        </div>
        <div class="field"><label for="feedback">コーチからのフィードバック</label><textarea id="feedback" required style="min-height:160px" placeholder="今日の練習の様子や、がんばったことを書いてください"></textarea></div>
        <div class="field"><label for="good">よかったところ・できたこと（任意）</label><textarea id="good"></textarea></div>
        <div class="field"><label for="next">次回の目標（任意）</label><input type="text" id="next"></div>
        <div class="field"><label for="home">おうちでできる練習（任意）</label><textarea id="home"></textarea></div>
        <div class="field"><label for="notice">おしらせ・持ち物（任意）</label><textarea id="notice"></textarea></div>
        <button class="btn btn-primary" type="submit" id="saveBtn">保存する</button>
        <p class="status" id="saveStatus" role="status"></p>
      </form>
      <div id="sendBox" hidden class="form" style="margin-top:12px">
        <div class="field"><label for="sendText">保護者さまへ送る文（コピーしてLINEへ）</label><textarea id="sendText" readonly></textarea></div>
        <button class="btn btn-outline" type="button" data-copy="sendText">文をコピー</button>
      </div>
    </section>

    <!-- 既読・メッセージ -->
    <section class="card">
      <h2><span class="dot"></span>既読・メッセージ</h2>
      <button class="btn btn-outline" type="button" id="reloadBtn">最新の状況にする</button>
      <h3 class="tbl-h">メッセージ</h3>
      <div class="table-scroll"><table><thead><tr><th>受信</th><th>生徒</th><th>差出人</th><th>内容</th></tr></thead><tbody id="msgRows"></tbody></table></div>
      <h3 class="tbl-h">連絡帳（新しい順）</h3>
      <div class="table-scroll"><table><thead><tr><th>日付</th><th>生徒</th><th>回</th><th>既読</th></tr></thead><tbody id="entryRows"></tbody></table></div>
      <p class="note">連絡帳の文章を直したいときは、スプレッドシートの「連絡帳」シートで直接書き換えられます。</p>
    </section>

    <!-- 生徒 -->
    <section class="card">
      <h2><span class="dot"></span>生徒さん</h2>
      <form class="form" id="studentForm">
        <div class="grid2">
          <div class="field"><label for="sName">名前</label><input type="text" id="sName" required placeholder="そうた"></div>
          <div class="field"><label for="sGrade">学年・年齢（任意）</label><input type="text" id="sGrade" placeholder="小学2年"></div>
        </div>
        <button class="btn btn-outline" type="submit" id="addBtn">生徒さんを登録</button>
        <p class="status" id="addStatus" role="status"></p>
      </form>
      <div id="newStudentBox" hidden class="form" style="margin-top:12px">
        <div class="field"><label for="welcomeText">専用リンクのご案内（最初に1回だけLINEで送る）</label><textarea id="welcomeText" readonly style="min-height:140px"></textarea></div>
        <button class="btn btn-outline" type="button" data-copy="welcomeText">文をコピー</button>
      </div>
      <h3 class="tbl-h">登録済み</h3>
      <div class="table-scroll"><table><thead><tr><th>名前</th><th>回数</th><th>専用リンク</th></tr></thead><tbody id="studentRows"></tbody></table></div>
    </section>
  </div>
</main>

<script>
(function () {
  const C = window.SK8_CONFIG, S = window.SK8, el = S.el, $ = (id) => document.getElementById(id);
  $("school").textContent = C.schoolName;
  let KEY = S.store("sk8-admin-key") || "", DB = null;

  const linkFor = (id) => new URL("index.html#s=" + id, location.href).toString();
  const fmtAt = (s) => String(s || "").slice(5).replace("-", "/");
  const say = (id, text, kind) => { $(id).className = "status" + (kind ? " " + kind : ""); $(id).textContent = text; };
  const errText = (e) => e.code === "bad_key" ? "合言葉が違います。" : e.code === "no_gas" ? "config.js に Apps Script のURLが入っていません。" : "通信できませんでした。少し待ってからもう一度お試しください。";

  // ----- データ読み込みと表示 -----
  async function load() {
    DB = await S.get({ key: KEY });
    const counts = {}; DB.entries.forEach((e) => counts[e.student] = (counts[e.student] || 0) + 1);

    const cur = $("student").value;
    $("student").replaceChildren(el("option", { value: "" }, "選んでください"),
      ...DB.students.map((s) => el("option", { value: s.id }, s.name + (s.grade ? "（" + s.grade + "）" : ""))));
    $("student").value = cur;

    $("studentRows").replaceChildren(...(DB.students.length ? DB.students.map((s) => el("tr", {},
      el("td", {}, s.name), el("td", {}, String(counts[s.id] || 0)),
      el("td", {}, el("button", { class: "mini", type: "button", onclick: (ev) => copy(linkFor(s.id), ev.target) }, "リンクをコピー"))))
      : [el("tr", {}, el("td", { colspan: "3" }, "まだ登録がありません。上のフォームから登録してください。"))]));

    const entries = DB.entries.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt).localeCompare(String(a.createdAt)));
    $("entryRows").replaceChildren(...(entries.length ? entries.map((e) => el("tr", {},
      el("td", {}, S.shortDate(e.date)), el("td", {}, e.name), el("td", {}, e.count),
      el("td", {}, el("span", { class: "pill " + (e.readAt ? "done" : "try") }, e.readAt ? "既読 " + fmtAt(e.readAt) : "未読"))))
      : [el("tr", {}, el("td", { colspan: "4" }, "まだありません"))]));

    const msgs = DB.messages.slice().reverse();
    $("msgRows").replaceChildren(...(msgs.length ? msgs.map((m) => el("tr", {},
      el("td", {}, fmtAt(m.at)), el("td", {}, m.name), el("td", {}, m.from), el("td", { style: "white-space:pre-wrap;min-width:12em" }, m.text)))
      : [el("tr", {}, el("td", { colspan: "4" }, "メッセージはまだありません"))]));
  }

  // 生徒を選んだら「何回目」を自動で入れる（前回の回数＋1。初めてなら1）
  $("student").addEventListener("change", () => {
    if (!DB) return;
    const counts = DB.entries.filter((e) => e.student === $("student").value)
      .map((e) => parseInt(e.count, 10)).filter((n) => n > 0);
    $("count").value = $("student").value ? (counts.length ? Math.max(...counts) : 0) + 1 : "";
  });

  // ----- ログイン -----
  async function login() {
    say("loginStatus", "確認中…");
    try { await load(); S.store("sk8-admin-key", KEY); $("loginCard").hidden = true; $("app").hidden = false; restoreDraft(); }
    catch (e) { say("loginStatus", errText(e), "err"); }
  }
  $("key").value = KEY;
  $("loginForm").addEventListener("submit", (ev) => { ev.preventDefault(); KEY = $("key").value.trim(); login(); });
  if (KEY) login();
  $("date").value = new Date().toLocaleDateString("sv-SE");

  // ----- 書きかけを守る -----
  // 1行の入力欄で改行（Enter）を押しても保存されないようにする
  $("entryForm").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && ev.target.tagName === "INPUT") ev.preventDefault();
  });
  // 書いている内容をこの端末に下書き保存（アプリを切り替えて画面が読み込み直されても戻せるように）
  const DRAFT_FIELDS = ["student", "date", "count", "feedback", "good", "next", "home", "notice"];
  const DRAFT_KEY = "sk8-entry-draft";
  function saveDraft() {
    const d = {}; DRAFT_FIELDS.forEach((id) => d[id] = $(id).value);
    S.store(DRAFT_KEY, JSON.stringify(d));
  }
  function clearDraft() { S.store(DRAFT_KEY, ""); }
  function restoreDraft() {
    let d = null; try { d = JSON.parse(S.store(DRAFT_KEY) || "null"); } catch (e) {}
    if (!d || !(d.feedback || d.good || d.next || d.home || d.notice)) return;
    DRAFT_FIELDS.forEach((id) => { if (d[id] != null) $(id).value = d[id]; });
    say("saveStatus", "書きかけの内容を戻しました。まだ保存されていません。", "ok");
  }
  $("entryForm").addEventListener("input", saveDraft);
  $("entryForm").addEventListener("change", saveDraft);

  // ----- 連絡帳を保存 -----
  $("entryForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const st = DB.students.find((s) => s.id === $("student").value);
    $("saveBtn").disabled = true; say("saveStatus", "保存中…");
    try {
      await S.post({ type: "entry", key: KEY, student: st.id, date: $("date").value,
        count: $("count").value, feedback: $("feedback").value.trim(), good: $("good").value.trim(),
        next: $("next").value.trim(), home: $("home").value.trim(), notice: $("notice").value.trim() });
      say("saveStatus", "保存しました。下の文をLINEで送ってください。", "ok");
      $("sendText").value = `${st.name}さんの今日の連絡帳が届きました🛹\nいつものリンクからご覧ください。読んだら「読みました」ボタンを押してくださいね。\n${linkFor(st.id)}`;
      $("sendBox").hidden = false;
      ["feedback", "good", "next", "home", "notice"].forEach((id) => $(id).value = "");
      clearDraft();
      await load(); $("count").value = "";
    } catch (e) { say("saveStatus", errText(e), "err"); }
    finally { $("saveBtn").disabled = false; }
  });

  // ----- 生徒を登録 -----
  $("studentForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const name = $("sName").value.trim();
    $("addBtn").disabled = true; say("addStatus", "登録中…");
    try {
      const r = await S.post({ type: "student", key: KEY, name, grade: $("sGrade").value.trim() });
      say("addStatus", name + "さんを登録しました。下の文を保護者さまにLINEで送ってください。", "ok");
      $("welcomeText").value = `${C.schoolName}です。\n${name}さんの「スケボー連絡帳」の専用リンクです。\nレッスンのたびにここに連絡帳が追加され、これまでの記録もすべて見られます。ブックマークやホーム画面への追加がおすすめです。\n${linkFor(r.id)}\n※ご家族以外には共有しないでください。\n\n使い方はこちら\n${new URL("guide.html", location.href)}`;
      $("newStudentBox").hidden = false; $("sName").value = ""; $("sGrade").value = "";
      await load();
    } catch (e) { say("addStatus", errText(e), "err"); }
    finally { $("addBtn").disabled = false; }
  });

  // ----- コピー -----
  function copy(text, btn) {
    const done = () => { const t = btn.textContent; btn.textContent = "コピーしました"; setTimeout(() => btn.textContent = t, 1500); };
    navigator.clipboard.writeText(text).then(done).catch(() => { window.prompt ? window.prompt("コピーしてください", text) : null; });
  }
  document.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => copy($(b.dataset.copy).value, b)));
  $("reloadBtn").addEventListener("click", async () => { try { await load(); } catch (e) { alert(errText(e)); } });
})();
</script>
</body>
</html>
